<!-- Display GoatCounter pageviews -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const base = `https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/`;

    const fetchCount = (url, el) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);

      fetch(url, { signal: controller.signal })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          const count = data.count.replace(/\D/g, '');
          el.innerText = new Intl.NumberFormat().format(count);
        })
        .catch((error) => {
          el.innerText = '1';
        })
        .finally(() => clearTimeout(timer));
    };

    // 文章页：统计当前文章的访问量
    const pv = document.getElementById('pageviews');

    if (pv !== null) {
      const uri = location.pathname.replace(/\/$/, '');
      fetchCount(`${base}${encodeURIComponent(uri)}.json`, pv);
    }

    // 主页：统计主页自身的访问量（固定取 baseurl 路径，不受分页影响）
    const homePv = document.getElementById('home-pageviews');

    if (homePv !== null) {
      const uri = '{{ site.baseurl | default: "" }}' || '/';
      fetchCount(`${base}${encodeURIComponent(uri)}.json`, homePv);
    }

    // 主页：统计全站总访问量（TOTAL 为 GoatCounter 保留路径，区分大小写）
    const sitePv = document.getElementById('site-pageviews');

    if (sitePv !== null) {
      fetchCount(`${base}TOTAL.json`, sitePv);
    }
  });
</script>
