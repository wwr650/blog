# 手动运行：根据 Git 提交时间，批量同步所有推文的 last_modified_at，并重新构建部署
name: Sync last_modified_at for all posts

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 同步 + 构建
  sync-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整 Git 历史获取修改时间

      # ── 同步 last_modified_at ──
      - name: Sync last_modified_at for all posts
        run: |
          echo "🔍 Scanning all posts..."

          all_posts=$(git -c core.quotepath=false ls-files '_posts/*.md' '_posts/*.markdown' 2>/dev/null || true)

          if [ -z "$all_posts" ]; then
            echo "❌ No posts found."
            exit 0
          fi

          echo "$all_posts" | while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              continue
            fi

            lastmod=$(git log -1 --format="%ci" -- "$file" 2>/dev/null || true)

            if [ -z "$lastmod" ]; then
              echo "  ⚠ Skipped (no git history): $file"
              continue
            fi

            echo "  → $file"

            if grep -q "^last_modified_at:" "$file"; then
              old_val=$(grep "^last_modified_at:" "$file" | sed 's/^last_modified_at:[[:space:]]*//')
              sed -i "s/^last_modified_at:.*/last_modified_at: $lastmod/" "$file"
              echo "    ✓ Updated: $old_val → $lastmod"
            else
              sed -i "/^date:/a last_modified_at: $lastmod" "$file"
              echo "    ✓ Added: $lastmod"
            fi
          done

          echo ""
          echo "✅ Sync complete!"

      - name: Commit changes (if any)
        run: |
          if [[ -n $(git status _posts/ -s) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _posts/
            if git commit -m "chore: sync last_modified_at for all posts [skip ci]"; then
              echo "✅ Committed changes, pushing..."
              git push origin main
            else
              echo "No changes to commit"
            fi
          else
            echo "No changes to last_modified_at"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 构建 Jekyll 站点 ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: 'Gemfile.lock'
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CSS vendors
        run: |
          npm install --no-fund --no-audit
          npm run build:css

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # 部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
